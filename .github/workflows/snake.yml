
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Alejandra300905
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF69B4&color_dots=%23F8BBD0,%23F4A6CD,%23EF93C4,%23E879B9,%23D94F9D
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF69B4

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
